<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixed bottom bar</title>
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; height: 3000px; }
  #cookie { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; background: #333; color: #fff; padding: 12px; box-sizing: border-box; }
</style>
</head>
<body>
<p style="padding:20px">A page with its own fixed-bottom UI (think cookie banner).</p>
<div id="cookie">We use cookies. <button id="ok">OK</button></div>
</body>
</html>
