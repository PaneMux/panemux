<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PaneMux Options</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face { font-family: "PaneMux JetBrains Mono"; font-weight: 400; src: url("../ui/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "PaneMux JetBrains Mono"; font-weight: 700; src: url("../ui/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
    :root {
      --bg: #07070b; --panel: rgba(10,10,15,0.92); --text: #d8ffe0; --dim: #6b7f70; --green: #39ff14; --cyan: #00e5ff;
      font-family: "PaneMux JetBrains Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { color: var(--green); font-size: 22px; margin: 0 0 4px; text-shadow: 0 0 8px var(--green); }
    h1 span { color: var(--dim); font-weight: 400; font-size: 14px; }
    h2 { font-size: 14px; color: var(--cyan); text-transform: uppercase; letter-spacing: .1em; margin: 32px 0 10px; }
    .panel { background: var(--panel); border: 1px solid var(--green); box-shadow: 0 0 8px rgba(57,255,20,.35); border-radius: 6px; padding: 16px; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px dashed #1c2a1f; }
    label.row:last-child { border-bottom: 0; }
    .hint { color: var(--dim); font-size: 12px; }
    input[type=text], input[type=number], select {
      background: #0d0f14; color: var(--text); border: 1px solid #2a3a2e; border-radius: 4px; padding: 4px 8px; font: inherit; width: 200px;
    }
    input:focus, select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 6px rgba(57,255,20,.5); }
    input[type=checkbox] { accent-color: var(--green); width: 18px; height: 18px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 4px 8px; border-bottom: 1px solid #141c16; vertical-align: top; }
    td:first-child { width: 30%; }
    kbd { color: var(--green); background: #0d140f; border: 1px solid #1f3a22; border-radius: 3px; padding: 0 5px; margin-right: 4px; font: inherit; font-size: 13px; }
    #status { color: var(--green); height: 1.5em; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>PaneMux <span>// phase 4 — undo tree + splits</span></h1>

  <h2>Appearance</h2>
  <div class="panel">
    <label class="row"><span>Theme<br><span class="hint">Terminal HUD or plain Vimium look</span></span>
      <select id="theme"><option value="terminal">Terminal HUD</option><option value="classic">Classic Vimium</option></select></label>
    <label class="row"><span>Show mode orb</span><input type="checkbox" id="showModeOrb"></label>
  </div>

  <h2>Behaviour</h2>
  <div class="panel">
    <label class="row"><span>Smooth scrolling</span><input type="checkbox" id="smoothScroll"></label>
    <label class="row"><span>Scroll step (px)</span><input type="number" id="scrollStep" min="10" max="1000"></label>
    <label class="row"><span>Hint characters<br><span class="hint">At least 2 unique chars</span></span><input type="text" id="hintChars"></label>
    <label class="row"><span>F opens links in background tab</span><input type="checkbox" id="openNewTabInBackground"></label>
    <label class="row"><span>Normal-mode <kbd>u</kbd><br><span class="hint">Vim undo, or Vimium half-page up (Ctrl-u always scrolls)</span></span>
      <select id="uKey"><option value="undo">Undo</option><option value="scroll">Half page up</option></select></label>
    <label class="row"><span>Ambiguous-key timeout (ms)</span><input type="number" id="ambiguousTimeout" min="100" max="5000"></label>
  </div>
  <div id="status"></div>

  <h2>Key bindings</h2>
  <div class="panel"><table id="keys"></table></div>
</main>
<script src="../content/settings.js"></script>
<script src="options.js"></script>
</body>
</html>
